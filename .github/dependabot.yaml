version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      backend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    ignore:
      # Match Node types to the runtime; review Node majors together after LTS promotion.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # jest-dom's Assertion augmentation currently conflicts with Vitest 5's types.
      - dependency-name: vitest
        versions: ["5.x"]
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/docker/backend, /docker/frontend]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    ignore:
      # Coordinate Node majors with package.json engines and @types/node after LTS review.
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      build-images:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      service-images:
        patterns: ["*"]
        update-types: [minor, patch]
