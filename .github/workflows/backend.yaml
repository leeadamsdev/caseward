name: Backend

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    backend:
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Match container permissions to the runner
              run: |
                  echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
                  echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

            - name: Build and start services
              run: docker compose up --build --wait --wait-timeout 300

            - name: Check backend
              run: docker compose exec -T backend composer check

            - name: Audit dependencies
              run: docker compose exec -T backend composer audit:check

            - name: Show service logs on failure
              if: failure()
              run: docker compose logs --no-color

            - name: Clean up
              if: always()
              run: docker compose down --volumes --remove-orphans
