name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match container permissions to the runner
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate build configuration
        run: docker compose build --print backend > "$RUNNER_TEMP/backend-bake.json"

      - name: Build backend with cached layers
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: ${{ runner.temp }}/backend-bake.json
          targets: backend
          load: true
          set: |
            backend.cache-from=type=gha,scope=caseward-backend
            backend.cache-to=type=gha,scope=caseward-backend,mode=max

      - name: Start services
        run: docker compose up --no-build --wait --wait-timeout 300 backend

      - name: Check backend
        run: docker compose exec -T backend composer check

      - name: Audit dependencies
        run: docker compose exec -T backend composer audit:check

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
