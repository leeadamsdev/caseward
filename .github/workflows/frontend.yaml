name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match container permissions to the runner
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate build configuration
        run: docker compose build --print frontend > "$RUNNER_TEMP/frontend-bake.json"

      - name: Build frontend with cached layers
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: ${{ runner.temp }}/frontend-bake.json
          targets: frontend
          load: true
          set: |
            frontend.cache-from=type=gha,scope=caseward-frontend
            frontend.cache-to=type=gha,scope=caseward-frontend,mode=max

      - name: Start frontend
        run: docker compose up --no-build --wait --wait-timeout 300 frontend

      - name: Install browser system dependencies
        run: docker compose exec -T --user root frontend pnpm exec playwright install-deps chromium

      - name: Install Chromium
        run: docker compose exec -T frontend pnpm exec playwright install chromium

      - name: Check frontend
        run: docker compose exec -T -e CI=true frontend pnpm run check

      - name: Audit dependencies
        run: docker compose exec -T frontend pnpm audit

      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-tests
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color frontend

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
