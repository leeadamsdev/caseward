name: Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/dependency-cache
        id: dependencies
        with:
          frontend: "true"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.dependencies.outputs.node-version }}
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" --allow-scripts=pnpm --no-fund

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          pnpm_config_store_dir: ${{ steps.dependencies.outputs.cache-directory }}/pnpm
          pnpm_config_cache_dir: ${{ steps.dependencies.outputs.cache-directory }}/pnpm-metadata

      - name: Check formatting, types, lint and fast tests
        run: pnpm run check:static

      - name: Audit dependencies
        run: pnpm audit

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run browser tests against the production build
        run: pnpm run test:browser
        env:
          CI: "true"

      - name: Upload failed browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-tests
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 3
          if-no-files-found: ignore
