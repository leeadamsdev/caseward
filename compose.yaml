name: caseward

services:
    backend:
        build:
            context: ./docker/backend
            args:
                APP_UID: ${APP_UID:-1000}
                APP_GID: ${APP_GID:-1000}
        ports:
            - "127.0.0.1:8000:8000"
        volumes:
            - ./backend:/var/www/app
            - backend_vendor:/var/www/app/vendor
        depends_on:
            postgres:
                condition: service_healthy
        init: true
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 120s

    postgres:
        image: postgres:18.6-trixie
        environment:
            POSTGRES_PASSWORD: caseward_local_admin
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-caseward.sql:ro
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    backend_vendor:
    postgres_data:
