name: caseward

services:
    frontend:
        build:
            context: ./docker/frontend
            args:
                APP_UID: ${APP_UID:-1000}
                APP_GID: ${APP_GID:-1000}
        ports:
            - "127.0.0.1:5173:5173"
        volumes:
            - ./frontend:/var/www/app
            - ./.editorconfig:/var/www/.editorconfig:ro
            - frontend_node_modules:/var/www/app/node_modules
            - frontend_router_types:/var/www/app/.react-router
        environment:
            CHOKIDAR_USEPOLLING: "true"
            API_PROXY_TARGET: http://backend:8000
        init: true
        healthcheck:
            test: ["CMD", "node", "--input-type=module", "-e", "const response = await fetch('http://127.0.0.1:5173'); process.exit(response.ok ? 0 : 1);"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 120s

    backend:
        image: caseward-backend
        build: &backend-build
            context: ./docker/backend
            args:
                APP_UID: ${APP_UID:-1000}
                APP_GID: ${APP_GID:-1000}
        ports:
            - "127.0.0.1:8000:8000"
        volumes: &backend-volumes
            - ./backend:/var/www/app
            - backend_vendor:/var/www/app/vendor
        depends_on:
            postgres:
                condition: service_healthy
            valkey:
                condition: service_healthy
            mailpit:
                condition: service_healthy
        init: true
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 120s

    worker:
        image: caseward-backend
        build: *backend-build
        volumes: *backend-volumes
        entrypoint: ["/bin/sh", "-c", 'mkdir -p bootstrap/cache storage/framework/views && exec php "$@"', "--"]
        command: ["artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--backoff=10", "--timeout=30", "--max-time=3600"]
        depends_on:
            backend:
                condition: service_healthy
        init: true
        restart: unless-stopped
        stop_grace_period: 45s
        healthcheck:
            test: ["CMD", "php", "artisan", "queue:monitor", "redis:default"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
            - "127.0.0.1:8025:8025"
        volumes:
            - mailpit_data:/data
        environment:
            MP_DATABASE: /data/mailpit.db
            MP_MAX_AGE: 1d
            MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
            MP_SMTP_DISABLE_RDNS: "true"
        healthcheck:
            test: ["CMD", "/mailpit", "readyz"]
            interval: 5s
            timeout: 5s
            retries: 10

    valkey:
        image: valkey/valkey:9.1.2-trixie
        command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
        volumes:
            - valkey_data:/data
            - ./docker/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
            - ./docker/valkey/users.acl:/usr/local/etc/valkey/users.acl:ro
        healthcheck:
            test: ["CMD", "valkey-cli", "--user", "caseward", "--pass", "caseward_local", "--no-auth-warning", "-e", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

    postgres:
        image: postgres:18.6-trixie
        environment:
            POSTGRES_PASSWORD: caseward_local_admin
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-caseward.sql:ro
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    frontend_node_modules:
    frontend_router_types:
    backend_vendor:
    mailpit_data:
    valkey_data:
    postgres_data:
